# DATASETS
# This list is just an informative list of available datasets. Select one in the 'dataset' entry below.
available_datasets:
  - "speech_commands"
  - "motion_sense_accelerometer"
  - "corscience"
  - "daliac"

experiment_description: daliac # Experiment description

# DATASET
dataset: "daliac"  # Dataset name
sample_rate: 204.8  # Sample rate (units: Hz)
input_shape: [2048, 1]  # Input shape (units: [samples, channels])
nb_classes: 13  # Number of classes
classes_filter: [] #[0, 2, 6, 8]  # List of classes used for optimization

# EvoNAS hyper-parameters
nb_generations: 20  # Number of generations
population_size: 200  # Population size
nb_best_models_crossover: 50  # Number of models used for crossover
mutation_rate: 20  # Mutation rate (units: percent)
max_nb_feature_layers: 25  # Max number of layers before GAP, GMP, or Flatten
max_nb_classification_layers: 10  # Max number of layers after GAP, GMP, or Flatten
path_gene_pool: gene_pool.txt  # File path for gene pool
path_rule_set: rule_set.txt  # File path for rule set
power_measurement_nb_samples_average: 1000  # Number of samples for power measurement averaging
power_measurement_threshold: 4000  # Power measurement threshold (units: uA)

# DNN training hyper-parameters
nb_epochs: 300  # Number of epochs
min_free_space_gpu: 3000000000  # Minimum free space on GPU (units: bytes)

# Constraints
max_memory_footprint: 1000000  # Maximum memory footprint (units: Bytes) --> only used to decide if a model should be trained or not
max_ram_usage: 240000  # Maximum RAM usage (units: Bytes)
max_rom_usage: 800000  # Maximum ROM usage (units: Bytes)
max_inference_time: 200  # Maximum inference time (units: ms)
max_energy_consumption: 2.5  # Maximum energy consumption (units: mJ)
