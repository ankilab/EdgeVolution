#########################################################
# Use this file for test runs. It has a low number of generations, epochs and population size.
# Before usage adapt the the parameters to your needs.
#########################################################

### General parameters:
optimize_for_MCU:
  value: true
min_free_space_gpu:
  value: 6_000_000

### Dataset/DNN training hyper-parameters:
dataset_name:
  value: "speech_commands"
sample_rate:
  value: 6000
input_shape:
  value: [6000, 1]
num_classes:
  value: 12
classes_filter:
  value: []
top_activation:
  value: "softmax"
num_epochs:
  value: 1
batch_size:
  value: 64
lr_scheduler:
  value: [(5, 0.01), (10, 0.001), (15, 0.0001)] # [(until_epoch, lr), (until_epoch, lr), ...]
optimizer:
  value: "adam"
loss:
  value: "categorical_crossentropy"
metrics:
  value: ["accuracy"]

### EvoNAS hyper-parameters:
num_generations:
  value: 5
population_size:
  value: 5
num_best_models_crossover:
  value: 3
mutation_rate:
  value: 15
population_size_decay:
  value: [[1, 3], [3, 3], [5, 3]] # [(until_generation, decay), (until_generation, decay), ...]
num_best_models_crossover_decay:
  value: [[1, 2], [3, 2], [5, 2]] # [(until_generation, decay), (until_generation, decay), ...]
mutation_rate_decay:
  value: [[1, 15], [2, 10], [3, 5], [4, 5]] # [(until_generation, decay), (until_generation, decay), ...]
max_num_feature_layers:
  value: 8
max_num_classification_layers:
  value: 5

### Fitness
min_rom_usage:
  value: 100_000
min_energy_information:
  value: 1.0
acc_weight:
  value: 0.8
rom_usage_weight:
  value: 0.1
energy_information_weight:
  value: 0.1

### Continue from
continue_from:
  value: [null, null]



