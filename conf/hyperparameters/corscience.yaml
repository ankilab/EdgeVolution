### General parameters:
optimize_for_MCU:
  value: true
min_free_space_gpu:
  value: 3_000_000

### Dataset/DNN training hyper-parameters:
dataset_name:
  value: "corscience"
sample_rate:
  value: 500
input_shape:
  value: [2500, 1]
num_classes:
  value: 1
classes_filter:
  value: []
top_activation:
  value: "sigmoid"
num_epochs:
  value: 2
batch_size:
  value: 32
lr_scheduler:
  value: [(25, 0.001), (50, 0.0001), (75, 0.00001)] # [(until_epoch, lr), (until_epoch, lr), ...]
optimizer:
  value: "adam"
loss:
  value: "binary_crossentropy"
metrics:
  value: ["accuracy"]

### EvoNAS hyper-parameters:
num_generations:
  value: 2
population_size:
  value: 3
num_best_models_crossover:
  value: 50
mutation_rate:
  value: 15
max_num_feature_layers:
  value: 15
max_num_classification_layers:
  value: 5

### Fitness
min_rom_usage:
  value: 100_000
min_energy_information:
  value: 1.0
acc_weight:
  value: 1.0
rom_usage_weight:
  value: 0
energy_information_weight:
  value: 0

### Continue from
continue_from:
  value: [null, null]



