# Unified Search Space Configuration for Speech Commands
#
# This format merges layer definitions and connectivity rules into a single
# coherent structure. Categories define default successor rules, and individual
# layers can override them when needed.
#
# Benefits:
# - Single source of truth (no sync issues between gene_pool and rule_set)
# - Adding a new layer automatically inherits category rules
# - Explicit layer-level overrides for special cases
# - Better documentation and maintainability

# =============================================================================
# Categories define groups of layers and their default connectivity rules
# =============================================================================
categories:
  preprocessing:
    description: "Initial signal processing layers (STFT, etc.)"
    successors: [magnitude]

  magnitude:
    description: "Magnitude extraction from complex signals"
    successors: [feature_extraction, filterbank]

  filterbank:
    description: "Frequency-domain filterbank layers"
    successors: [feature_extraction, decibel]

  decibel:
    description: "Decibel conversion layers"
    successors: [feature_extraction]

  feature_extraction:
    description: "Convolutional and other feature extraction layers"
    successors: [feature_extraction, pooling, global_pooling]

  pooling:
    description: "Local pooling layers"
    successors: [feature_extraction]

  global_pooling:
    description: "Global pooling layers that flatten spatial dimensions"
    successors: [classification]

  classification:
    description: "Dense layers for classification"
    successors: [classification]
    terminal: true

# =============================================================================
# Valid starting layers
# =============================================================================
start: [STFT_2D]

# =============================================================================
# Layer definitions
# =============================================================================
layers:
  # ---------------------------------------------------------------------------
  # Preprocessing layers
  # ---------------------------------------------------------------------------
  STFT_2D:
    category: preprocessing
    f_name: STFT
    n_fft: [64, 512, 16]
    hop_length: [128, 396, 16]
    input_data_format: [channels_last]
    output_data_format: [channels_last]

  # ---------------------------------------------------------------------------
  # Magnitude layers
  # ---------------------------------------------------------------------------
  MAG_2D:
    category: magnitude
    f_name: Magnitude()

  # ---------------------------------------------------------------------------
  # Filterbank layers
  # NOTE: get_filterbank_layer also requires 'sample_rate' and 'n_fft' params,
  # which are injected at translation time by prepare_stft_and_fb_genes.py
  # (derived from the preceding STFT layer). They are not part of the search.
  # ---------------------------------------------------------------------------
  FB_2D:
    category: filterbank
    f_name: get_filterbank_layer
    type: [mel]
    n_mels: [32, 128, 8]
    mel_f_min: [0, 0, 1]
    mel_f_max: [3000, 3000, 1]
    output_data_format: [channels_last]

  # ---------------------------------------------------------------------------
  # Decibel conversion
  # ---------------------------------------------------------------------------
  MAG2DEC_2D:
    category: decibel
    f_name: MagnitudeToDecibel()

  # ---------------------------------------------------------------------------
  # Feature extraction layers (2D)
  # ---------------------------------------------------------------------------
  C_2D_BLOCK:
    category: feature_extraction
    f_name: get_conv2d_block
    filters: [4, 64, 1]
    kernel_height: [1, 12, 1]
    kernel_width: [1, 12, 1]
    strides: [1, 2, 1]
    padding: [same]
    norm_layer: ['None', BatchNormalization]
    activation: ['None', relu, sigmoid, tanh, leaky_relu]

  DC_2D_BLOCK:
    category: feature_extraction
    f_name: get_depthwise_conv2d_block
    kernel_height: [1, 12, 1]
    kernel_width: [1, 12, 1]
    strides: [1, 2, 1]
    padding: [same]
    norm_layer: ['None', BatchNormalization]
    activation: ['None', relu, sigmoid, tanh, leaky_relu]

  C_2D:
    category: feature_extraction
    f_name: Conv2D
    filters: [4, 48, 1]
    kernel_size: [1, 5, 1]
    strides: [1, 2, 1]
    padding: [same]
    activation: [relu]

  DC_2D:
    category: feature_extraction
    f_name: DepthwiseConv2D
    kernel_size: [1, 5, 1]
    strides: [1, 2, 1]
    padding: [same]
    activation: [relu]

  # ---------------------------------------------------------------------------
  # Pooling layers
  # ---------------------------------------------------------------------------
  MP_2D:
    category: pooling
    f_name: MaxPooling2D
    pool_size: [2, 4, 1]
    padding: [same]

  AP_2D:
    category: pooling
    f_name: AveragePooling2D
    pool_size: [2, 4, 1]
    padding: [same]

  BN_2D:
    category: feature_extraction
    f_name: BatchNormalization()

  # ---------------------------------------------------------------------------
  # Global pooling layers
  # ---------------------------------------------------------------------------
  GAP_2D:
    category: global_pooling
    f_name: GlobalAveragePooling2D()

  GMP_2D:
    category: global_pooling
    f_name: GlobalMaxPooling2D()

  # ---------------------------------------------------------------------------
  # Classification layers
  # ---------------------------------------------------------------------------
  D:
    category: classification
    f_name: Dense
    units: [8, 64, 8]
    activation: [relu]
