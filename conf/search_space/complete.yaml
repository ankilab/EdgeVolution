# Unified Search Space Configuration — Complete
#
# This is the full search space combining 1D and 2D paths with cross-dimensional
# transitions. Categories define default successor rules, and individual layers
# can override them when needed.
#
# Benefits:
# - Single source of truth (no sync issues between gene_pool and rule_set)
# - Adding a new layer automatically inherits category rules
# - Explicit layer-level overrides for special cases
# - Better documentation and maintainability

# =============================================================================
# Categories define groups of layers and their default connectivity rules
# =============================================================================
categories:
  # --- 1D path ---
  feature_extraction_1d:
    description: "1D convolutional feature extraction layers"
    successors: [feature_extraction_1d, pooling_1d, preprocessing, global_pooling_1d]

  pooling_1d:
    description: "1D local pooling layers"
    successors: [feature_extraction_1d, preprocessing]

  global_pooling_1d:
    description: "1D global pooling layers that flatten spatial dimensions"
    successors: [classification]

  # --- 2D path ---
  preprocessing:
    description: "Initial signal processing layers (STFT, etc.)"
    successors: [magnitude]

  magnitude:
    description: "Magnitude extraction from complex signals"
    successors: [feature_extraction_2d, filterbank]

  filterbank:
    description: "Frequency-domain filterbank layers"
    successors: [feature_extraction_2d, decibel]

  decibel:
    description: "Decibel conversion layers"
    successors: [feature_extraction_2d]

  feature_extraction_2d:
    description: "2D convolutional feature extraction layers"
    successors: [feature_extraction_2d, pooling_2d, global_pooling_2d]

  pooling_2d:
    description: "2D local pooling layers"
    successors: [feature_extraction_2d]

  global_pooling_2d:
    description: "2D global pooling layers that flatten spatial dimensions"
    successors: [classification]

  # --- shared ---
  classification:
    description: "Dense and regularization layers for classification"
    successors: [classification]
    terminal: true

# =============================================================================
# Valid starting layers
# STFT_2D listed twice to balance probability of starting with 1D vs 2D path
# =============================================================================
start: [STFT_2D, STFT_2D, C_1D, DC_1D]

# =============================================================================
# Layer definitions
# =============================================================================
layers:
  # ---------------------------------------------------------------------------
  # 1D feature extraction layers
  # ---------------------------------------------------------------------------
  C_1D:
    category: feature_extraction_1d
    f_name: Conv1D
    filters: [4, 32, 1]
    kernel_size: [1, 5, 1]
    strides: [1, 2, 1]
    padding: [same]
    activation: [relu]

  DC_1D:
    category: feature_extraction_1d
    f_name: DepthwiseConv1D
    kernel_size: [1, 5, 1]
    strides: [1, 2, 1]
    padding: [same]
    activation: [relu]

  BN_1D:
    category: feature_extraction_1d
    f_name: BatchNormalization()

  # ---------------------------------------------------------------------------
  # 1D pooling layers
  # ---------------------------------------------------------------------------
  MP_1D:
    category: pooling_1d
    f_name: MaxPooling1D
    pool_size: [2, 4, 1]
    padding: [same]

  AP_1D:
    category: pooling_1d
    f_name: AveragePooling1D
    pool_size: [2, 4, 1]
    padding: [same]

  # ---------------------------------------------------------------------------
  # 1D global pooling layers
  # ---------------------------------------------------------------------------
  GAP_1D:
    category: global_pooling_1d
    f_name: GlobalAveragePooling1D()

  GMP_1D:
    category: global_pooling_1d
    f_name: GlobalMaxPooling1D()

  # ---------------------------------------------------------------------------
  # Preprocessing layers
  # ---------------------------------------------------------------------------
  STFT_2D:
    category: preprocessing
    f_name: STFT
    n_fft: [64, 1024, 16]
    hop_length: [64, 396, 16]
    input_data_format: [channels_last]
    output_data_format: [channels_last]

  # ---------------------------------------------------------------------------
  # Magnitude layers
  # ---------------------------------------------------------------------------
  MAG_2D:
    category: magnitude
    f_name: Magnitude()

  # ---------------------------------------------------------------------------
  # Filterbank layers
  # NOTE: get_filterbank_layer also requires 'sample_rate' and 'n_fft' params,
  # which are injected at translation time by prepare_stft_and_fb_genes.py
  # (derived from the preceding STFT layer). They are not part of the search.
  # ---------------------------------------------------------------------------
  FB_2D:
    category: filterbank
    f_name: get_filterbank_layer
    type: [mel]
    n_mels: [32, 96, 4]
    mel_f_min: [0, 0, 1]
    mel_f_max: [90, 90, 1]
    output_data_format: [channels_last]

  # ---------------------------------------------------------------------------
  # Decibel conversion
  # ---------------------------------------------------------------------------
  MAG2DEC_2D:
    category: decibel
    f_name: MagnitudeToDecibel()

  # ---------------------------------------------------------------------------
  # 2D feature extraction layers
  # ---------------------------------------------------------------------------
  C_2D:
    category: feature_extraction_2d
    f_name: Conv2D
    filters: [4, 32, 1]
    kernel_size: [1, 5, 1]
    strides: [1, 2, 1]
    padding: [same]
    activation: [relu]

  DC_2D:
    category: feature_extraction_2d
    f_name: DepthwiseConv2D
    kernel_size: [1, 5, 1]
    strides: [1, 2, 1]
    padding: [same]
    activation: [relu]

  BN_2D:
    category: feature_extraction_2d
    f_name: BatchNormalization()

  # ---------------------------------------------------------------------------
  # 2D pooling layers
  # ---------------------------------------------------------------------------
  MP_2D:
    category: pooling_2d
    f_name: MaxPooling2D
    pool_size: [2, 4, 1]
    padding: [same]

  AP_2D:
    category: pooling_2d
    f_name: AveragePooling2D
    pool_size: [2, 4, 1]
    padding: [same]

  # ---------------------------------------------------------------------------
  # 2D global pooling layers
  # ---------------------------------------------------------------------------
  GAP_2D:
    category: global_pooling_2d
    f_name: GlobalAveragePooling2D()

  GMP_2D:
    category: global_pooling_2d
    f_name: GlobalMaxPooling2D()

  # ---------------------------------------------------------------------------
  # Classification layers
  # D and DO alternate (D -> DO -> D) via layer-level successor overrides
  # ---------------------------------------------------------------------------
  D:
    category: classification
    f_name: Dense
    units: [8, 128, 8]
    activation: [relu]
    successors: [DO]

  DO:
    category: classification
    f_name: Dropout
    rate: [0.0, 0.5, 0.1]
    successors: [D]
