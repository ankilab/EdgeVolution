# Unified Search Space Configuration for CIFAR-10
#
# This format merges layer definitions and connectivity rules into a single
# coherent structure. Categories define default successor rules, and individual
# layers can override them when needed.
#
# Benefits:
# - Single source of truth (no sync issues between gene_pool and rule_set)
# - Adding a new layer automatically inherits category rules
# - Explicit layer-level overrides for special cases
# - Better documentation and maintainability

# =============================================================================
# Categories define groups of layers and their default connectivity rules
# =============================================================================
categories:
  feature_extraction:
    description: "Convolutional and other feature extraction layers"
    successors: [feature_extraction, pooling, global_pooling]

  pooling:
    description: "Local pooling layers"
    successors: [feature_extraction]

  global_pooling:
    description: "Global pooling layers that flatten spatial dimensions"
    successors: [classification]

  classification:
    description: "Dense layers for classification"
    successors: [classification]
    terminal: true

# =============================================================================
# Valid starting layers
# =============================================================================
start: [C_2D_BLOCK, DC_2D_BLOCK]

# =============================================================================
# Layer definitions
# =============================================================================
layers:
  # ---------------------------------------------------------------------------
  # Feature extraction layers (2D)
  # ---------------------------------------------------------------------------
  C_2D_BLOCK:
    category: feature_extraction
    f_name: get_conv2d_block
    filters: [4, 64, 1]
    kernel_height: [1, 12, 1]
    kernel_width: [1, 12, 1]
    strides: [1, 2, 1]
    padding: [same]
    norm_layer: ['None', BatchNormalization]
    activation: ['None', relu, sigmoid, tanh, leaky_relu]

  DC_2D_BLOCK:
    category: feature_extraction
    f_name: get_depthwise_conv2d_block
    kernel_height: [1, 12, 1]
    kernel_width: [1, 12, 1]
    strides: [1, 2, 1]
    padding: [same]
    norm_layer: ['None', BatchNormalization]
    activation: ['None', relu, sigmoid, tanh, leaky_relu]

  BN_2D:
    category: feature_extraction
    f_name: BatchNormalization()

  # ---------------------------------------------------------------------------
  # Pooling layers
  # ---------------------------------------------------------------------------
  MP_2D:
    category: pooling
    f_name: MaxPooling2D
    pool_size: [2, 4, 1]
    padding: [same]

  AP_2D:
    category: pooling
    f_name: AveragePooling2D
    pool_size: [2, 4, 1]
    padding: [same]

  # ---------------------------------------------------------------------------
  # Global pooling layers
  # ---------------------------------------------------------------------------
  GAP_2D:
    category: global_pooling
    f_name: GlobalAveragePooling2D()

  GMP_2D:
    category: global_pooling
    f_name: GlobalMaxPooling2D()

  # ---------------------------------------------------------------------------
  # Classification layers
  # ---------------------------------------------------------------------------
  D:
    category: classification
    f_name: Dense
    units: [8, 64, 8]
    activation: [relu]
