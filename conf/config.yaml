    value: ???
    unit: null 
    icon: "ph:virus"
    displayname: "Mutation rate"
    group: "Evonas parameters"
    description: "The probability that a given model will be mutated during the evolutionary process."
    display: true

  mutation_rate:
    value: 1
    description: "This is just a placeholder for the mutation rate. It is determined by mutation_rate_decay."
    display: false

