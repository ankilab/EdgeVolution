    displayname: "Metrics"
    group: "Training parameters"
    description: "The metrics used to train the model."
    display: true


  ### EvoNAS hyper-parameters:
  num_generations:
    value: ???
    unit: null 
    icon: "iconoir:tree"
    displayname: "Generations"
    group: "Evonas parameters"
    description: "The total iterations or evolutionary cycles through which the algorithm refines neural architectures."
    display: true

  population_size_decay:
    value: ???
    unit: null 
    icon: "pepicons-pencil:people"
    displayname: "Population"
    group: "Evonas parameters"
    description: "The quantity of neural network models concurrently evaluated and evolved within each generation."
    display: true

  population_size:
    value: 1
    description: "This is just a placeholder for the population size. It is determined by population_size_decay."
    display: false

  num_best_models_crossover_decay:
