    group: "Evonas parameters"
    description: "The count of top-performing models selected for genetic crossover to generate new offspring."
    display: true

  num_best_models_crossover:
    value: 1
    description: "This is just a placeholder for the number of best models crossover. It is determined by num_best_models_crossover_decay."
    display: false

