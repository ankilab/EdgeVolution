# Replace <YOUR_BOARD_SNR> and <YOUR_PPK_SNR> with your device serial numbers.
# See conf/boards/README.md for instructions on finding these values.
value:
  - model: "nrf52840dk_nrf52840"  # Board model
    snr: "<YOUR_BOARD_SNR>"  # Serial number (find via `nrfjprog --ids`)
    ppk: "<YOUR_PPK_SNR>"  # PPK (Power Profiling Kit) serial number
    power_measurement_threshold: 4000  # Fallback only; adaptive threshold is computed at runtime
    max_available_tensor_arena_size: 155  # Use tools/determine_max_tensor_arena_size.py to verify
